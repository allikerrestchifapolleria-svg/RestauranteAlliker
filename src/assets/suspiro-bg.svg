<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="suspiroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC0CB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#suspiroGradient)"/>

  <!-- Plate -->
  <ellipse cx="200" cy="220" rx="150" ry="40" fill="#F5F5DC" opacity="0.8"/>
  <ellipse cx="200" cy="210" rx="140" ry="35" fill="#FFF8DC"/>

  <!-- Manjar blanco (dulce de leche) base -->
  <ellipse cx="200" cy="190" rx="80" ry="25" fill="#D2691E" opacity="0.9"/>
  <ellipse cx="200" cy="185" rx="75" ry="20" fill="#CD853F"/>

  <!-- Merengue (suspiro) -->
  <ellipse cx="200" cy="160" rx="70" ry="20" fill="#FFFACD" opacity="0.95"/>
  <ellipse cx="200" cy="155" rx="65" ry="15" fill="white"/>

  <!-- Galletas molida -->
  <rect x="140" y="175" width="15" height="8" rx="2" fill="#DEB887"/>
  <rect x="160" y="178" width="12" height="6" rx="2" fill="#D2B48C"/>
  <rect x="180" y="175" width="14" height="7" rx="2" fill="#DEB887"/>
  <rect x="200" y="178" width="11" height="6" rx="2" fill="#D2B48C"/>
  <rect x="220" y="175" width="13" height="8" rx="2" fill="#DEB887"/>
  <rect x="240" y="178" width="10" height="6" rx="2" fill="#D2B48C"/>
  <rect x="155" y="182" width="16" height="5" rx="2" fill="#F4A460"/>
  <rect x="185" y="180" width="13" height="7" rx="2" fill="#DEB887"/>
  <rect x="210" y="182" width="15" height="5" rx="2" fill="#F4A460"/>
  <rect x="235" y="180" width="12" height="6" rx="2" fill="#D2B48C"/>

  <!-- Decorative elements -->
  <circle cx="170" cy="145" r="3" fill="#FFD700"/>
  <circle cx="190" cy="142" r="2" fill="#FFA500"/>
  <circle cx="210" cy="145" r="3" fill="#FFD700"/>
  <circle cx="230" cy="142" r="2" fill="#FFA500"/>

  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Suspiro Limeño</text>
  <text x="200" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">Postre Tradicional</text>
</svg>