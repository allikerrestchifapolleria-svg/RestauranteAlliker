<div class="no-branch-container">
  <div class="card shadow-lg border-0 rounded-4 p-5 text-center" style="max-width: 500px; margin: 0 auto;">
    <div class="mb-4">
      <i class="fas fa-store-slash fa-5x text-danger"></i>
    </div>
    <h2 class="text-danger mb-3">Sin Sucursal Asignada</h2>
    <p class="text-muted fs-5 mb-4">
      No tienes una sucursal asignada. Por favor contacta al administrador para que te asigne una sucursal.
    </p>
    <button class="btn btn-danger btn-lg" (click)="logout()">
      <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
    </button>
  </div>
</div>
