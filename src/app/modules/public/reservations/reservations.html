<!-- Enhanced Reservation Form Section --&gt;
<section class="reservation-form-section py-5" id="reservationForm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="reservation-card shadow-lg rounded-4 overflow-hidden">
          <div class="card-header bg-primary text-white text-center py-4">
            <h2 class="mb-0">
              <i class="fas fa-calendar-plus me-2"></i>
              Hacer una Reserva
            </h2>
            <p class="mb-0 mt-2 opacity-75">Complete el formulario para garantizar su mesa</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()" class="reservation-form">
              <!-- Personal Information Section --&gt;
              <div class="form-section mb-4">
                <h4 class="section-title mb-3">
                  <i class="fas fa-user me-2 text-primary"></i>
                  Información Personal
                </h4>

                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="field">
                      <label for="name" class="form-label fw-semibold">
                        <i class="fas fa-signature me-1 text-muted"></i>
                        Nombre completo *
                      </label>
                      <input type="text" class="form-control form-control-lg" id="name" formControlName="name"
                        placeholder="Ingrese su nombre completo" maxlength="100" autocomplete="name"
                        (input)="reservationForm.get('name')?.setValue($any($event.target).value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, ''))">
                      <div class="field-feedback">
                        <ng-container *ngIf="reservationForm.get('name')?.invalid && reservationForm.get('name')?.touched">
                          <span *ngIf="reservationForm.get('name')?.errors?.['required']">Nombre es requerido</span>
                          <span *ngIf="reservationForm.get('name')?.errors?.['pattern']">Solo se permiten letras y espacios</span>
                        </ng-container>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="email" class="form-label fw-semibold">
                        <i class="fas fa-envelope me-1 text-muted"></i>
                        Correo electrónico *
                      </label>
                      <input type="email" class="form-control form-control-lg is-locked" id="email"
                        formControlName="email" readonly autocomplete="email">
                      <div class="field-feedback field-feedback--hint">
                        <i class="fas fa-lock me-1"></i>
                        Es el correo de tu cuenta, la reserva queda asociada a él
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="phone" class="form-label fw-semibold">
                        <i class="fas fa-phone me-1 text-muted"></i>
                        Teléfono *
                      </label>
                      <div class="input-group input-group-lg">
                        <span class="input-group-text">+51</span>
                        <input type="tel" class="form-control" id="phone" formControlName="phone"
                          placeholder="999 999 999" maxlength="9" inputmode="numeric" autocomplete="tel"
                          (input)="reservationForm.get('phone')?.setValue($any($event.target).value.replace(/[^0-9]/g, '').slice(0, 9))">
                      </div>
                      <div class="field-feedback">
                        <ng-container *ngIf="reservationForm.get('phone')?.invalid && reservationForm.get('phone')?.touched">
                          <span *ngIf="reservationForm.get('phone')?.errors?.['required']">Teléfono es requerido</span>
                          <span *ngIf="reservationForm.get('phone')?.errors?.['pattern']">Ingresa tus 9 dígitos del celular</span>
                        </ng-container>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="peopleCount" class="form-label fw-semibold">
                        <i class="fas fa-users me-1 text-muted"></i>
                        Número de personas *
                      </label>
                      <select class="form-select form-select-lg" id="peopleCount" formControlName="peopleCount">
                        <option *ngFor="let num of peopleCountOptions" [value]="num">
                          {{num}} {{num === 1 ? 'persona' : 'personas'}}
                        </option>
                      </select>
                      <div class="field-feedback"></div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Reservation Details Section --&gt;
              <div class="form-section mb-4">
                <h4 class="section-title mb-3">
                  <i class="fas fa-calendar-alt me-2 text-primary"></i>
                  Detalles de la Reserva
                </h4>

                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="field">
                      <label for="branch" class="form-label fw-semibold">
                        <i class="fas fa-building me-1 text-muted"></i>
                        Sucursal *
                      </label>
                      <select class="form-select form-select-lg" id="branch" formControlName="branchId">
                        <option value="" disabled>Seleccione una sucursal</option>
                        <option *ngFor="let branch of branches" [value]="branch.branchId">
                          {{branch.name}}
                        </option>
                      </select>
                      <div class="field-feedback">
                        <span *ngIf="reservationForm.get('branchId')?.invalid && reservationForm.get('branchId')?.touched">
                          Sucursal es requerida
                        </span>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="tableId" class="form-label fw-semibold">
                        <i class="fas fa-chair me-1 text-muted"></i>
                        Mesa disponible *
                      </label>
                      <select class="form-select form-select-lg" id="tableId" formControlName="tableId">
                        <option value="" disabled>
                          {{ reservationForm.get('branchId')?.value ? 'Seleccione una mesa libre' : 'Elija primero una sucursal' }}
                        </option>
                        <optgroup label="Mesas individuales" *ngIf="availableTables.length">
                          <option *ngFor="let table of availableTables" [value]="table.id">
                            {{table.name}} · hasta {{table.capacity}} personas
                          </option>
                        </optgroup>
                        <optgroup label="Mesas familiares" *ngIf="availableFamilyTables.length">
                          <option *ngFor="let table of availableFamilyTables" [value]="table.id">
                            {{table._displayName}} · hasta {{table.capacity}} personas
                          </option>
                        </optgroup>
                      </select>
                      <div class="field-feedback">
                        <span *ngIf="reservationForm.get('tableId')?.invalid && reservationForm.get('tableId')?.touched">
                          Mesa es requerida
                        </span>
                        <span class="field-feedback--hint"
                          *ngIf="reservationForm.get('branchId')?.value && !availableTables.length && !availableFamilyTables.length">
                          No hay mesas libres en esta sucursal ahora mismo
                        </span>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="date" class="form-label fw-semibold">
                        <i class="fas fa-calendar me-1 text-muted"></i>
                        Fecha *
                      </label>
                      <input type="date" class="form-control form-control-lg" id="date" formControlName="date"
                        [min]="today" (change)="onDateChange()">
                      <div class="field-feedback">
                        <span *ngIf="reservationForm.get('date')?.invalid && reservationForm.get('date')?.touched">
                          Fecha es requerida
                        </span>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="field">
                      <label for="time" class="form-label fw-semibold">
                        <i class="fas fa-clock me-1 text-muted"></i>
                        Hora *
                      </label>
                      <input type="time" class="form-control form-control-lg" id="time" formControlName="time">
                      <div class="field-feedback">
                        <span *ngIf="reservationForm.get('time')?.invalid && reservationForm.get('time')?.touched">
                          Hora es requerida
                        </span>
                        <span *ngIf="isReservationInThePast && reservationForm.get('time')?.touched">
                          La fecha y hora deben ser futuras
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Time Slots Info --&gt;
                <div class="time-info mt-3 p-3 bg-light rounded-3">
                  <div class="row text-center">
                    <div class="col-6">
                      <i class="fas fa-sun text-warning mb-1"></i>
                      <div class="small fw-semibold">Almuerzo</div>
                      <div class="small text-muted">12:00 - 15:00</div>
                    </div>
                    <div class="col-6">
                      <i class="fas fa-moon text-primary mb-1"></i>
                      <div class="small fw-semibold">Cena</div>
                      <div class="small text-muted">18:00 - 22:30</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Special Requests Section --&gt;
              <div class="form-section mb-4">
                <h4 class="section-title mb-3">
                  <i class="fas fa-comment-alt me-2 text-primary"></i>
                  Solicitudes Especiales
                </h4>

                <div class="mb-3">
                  <textarea class="form-control form-control-lg" id="specialRequests" formControlName="specialRequests"
                    rows="4" maxlength="500"
                    placeholder="¿Tiene alguna alergia alimentaria? ¿Preferencias dietéticas? ¿Celebración especial? ¿Necesita silla para bebé?"></textarea>
                  <div class="form-text">
                    <i class="fas fa-info-circle me-1"></i>
                    Opcional: Ayúdenos a hacer su experiencia perfecta
                  </div>
                </div>
              </div>

              <!-- Terms and Conditions --&gt;
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" formControlName="acceptTerms">
                <label class="form-check-label" for="termsCheck">
                  Acepto los <a href="#" class="text-primary text-decoration-none">términos y condiciones</a>
                  y la <a href="#" class="text-primary text-decoration-none">política de privacidad</a>
                </label>
              </div>
              <div *ngIf="reservationForm.get('acceptTerms')?.invalid && reservationForm.get('acceptTerms')?.touched"
                class="text-danger small mt-1">
                Debe aceptar los términos y condiciones
              </div>

              <!-- Submit Button --&gt;
              <div class="text-center">
                <button type="submit" [disabled]="isBusy"
                  class="btn btn-primary btn-lg px-5 py-3 rounded-pill shadow-lg">
                  <span *ngIf="callActive">
                    <i class="fas fa-phone-slash me-2"></i>
                    Finalizar Llamada
                  </span>
                  <span *ngIf="isAICalling && !callActive">
                    <i class="fas fa-spinner fa-spin me-2"></i>
                    Conectando llamada...
                  </span>
                  <span *ngIf="isLoading && !isAICalling && !callActive">
                    <i class="fas fa-spinner fa-spin me-2"></i>
                    Procesando Reserva...
                  </span>
                  <span *ngIf="!isLoading && !isAICalling && !callActive">
                    <i class="fas fa-calendar-check me-2"></i>
                    Confirmar Reserva
                  </span>
                </button>
                <p class="mt-3 mb-0 text-muted small">
                  <i class="fas fa-shield-alt me-1"></i>
                  Sus datos están seguros y protegidos
                </p>
              </div>
            </form>
          </div>
        </div>

        <!-- Neutral Message: reserva registrada / llamada en curso / esperando confirmacion --&gt;
        <div *ngIf="infoMessage" class="alert alert-info alert-dismissible fade show mt-4 shadow-lg" role="alert">
          <div class="d-flex align-items-center">
            <i class="fas fa-info-circle fa-2x me-3 text-info"></i>
            <div>
              <h5 class="alert-heading mb-1">Llamada de confirmación</h5>
              <p class="mb-0">{{infoMessage}}</p>
            </div>
          </div>
          <button type="button" class="btn-close" (click)="infoMessage = ''" aria-label="Close"></button>
        </div>

        <!-- Success Message: solo cuando la llamada confirmo la asistencia --&gt;
        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show mt-4 shadow-lg" role="alert">
          <div class="d-flex align-items-center">
            <i class="fas fa-check-circle fa-2x me-3 text-success"></i>
            <div>
              <h5 class="alert-heading mb-1">¡Reserva Confirmada!</h5>
              <p class="mb-0">{{successMessage}}</p>
            </div>
          </div>
          <button type="button" class="btn-close" (click)="successMessage = ''" aria-label="Close"></button>
        </div>

        <!-- Error Message --&gt;
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show mt-4 shadow-lg" role="alert">
          <div class="d-flex align-items-center">
            <i class="fas fa-exclamation-triangle fa-2x me-3 text-danger"></i>
            <div>
              <h5 class="alert-heading mb-1">{{errorTitle}}</h5>
              <p class="mb-0">{{errorMessage}}</p>
            </div>
          </div>
          <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>
</section>
